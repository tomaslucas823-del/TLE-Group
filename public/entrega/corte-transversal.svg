<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <rect width="640" height="360" fill="#f5f5f3"/>
  <!-- ground -->
  <line x1="40" y1="280" x2="600" y2="280" stroke="#1d1d1f" stroke-width="1.5"/>
  <!-- walls / volume -->
  <g stroke="#1d1d1f" stroke-width="2">
    <path d="M100 280 V120 H200 V280"/>
    <path d="M200 280 V160 H360 V280"/>
    <path d="M360 280 V100 H540 V280"/>
    <!-- roof line -->
    <path d="M90 120 L200 80 L360 80 L550 100"/>
    <!-- floor slab intermediate -->
    <path d="M200 200 H360" stroke-width="1.5"/>
    <path d="M360 180 H540" stroke-width="1.5"/>
  </g>
  <!-- material hatch walls -->
  <g stroke="#1d1d1f" stroke-width="0.8" opacity="0.35">
    <path d="M105 140 L120 155 M105 160 L125 180 M105 190 L125 210"/>
    <path d="M520 120 L540 140 M520 150 L540 170 M520 190 L540 210"/>
  </g>
  <g fill="#1d1d1f" font-family="system-ui,sans-serif" font-size="12">
    <text x="150" y="200" text-anchor="middle">Garagem</text>
    <text x="280" y="240" text-anchor="middle">Sala</text>
    <text x="450" y="150" text-anchor="middle">Piso 1</text>
    <text x="450" y="230" text-anchor="middle">Piso 0</text>
  </g>
  <text x="40" y="340" fill="#6e6e73" font-family="system-ui,sans-serif" font-size="11">Corte transversal · alturas e volumetria interna</text>
</svg>
